name: PupToss
options:
  bundleIdPrefix: com.baggioto
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PupToss:
    type: application
    platform: iOS
    sources: [PupToss]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baggioto.PupToss
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pup Toss
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  PupTossTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PupTossTests]
    dependencies:
      - target: PupToss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baggioto.PupTossTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PupToss:
    build:
      targets:
        PupToss: all
        PupTossTests: [test]
    test:
      targets: [PupTossTests]
